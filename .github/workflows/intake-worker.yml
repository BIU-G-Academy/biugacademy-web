# Tests for the preserved first-party intake Worker candidate (intake-worker/).
# Nothing here deploys: the Worker runs locally in workerd via `wrangler dev
# --local` with a local D1 database, and the browser test serves the site
# from the checkout. Runs on every pull request so it can be a required check.

name: Intake worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intake-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intake-worker:
    name: intake-worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      CHROME_PATH: /usr/bin/google-chrome
    defaults:
      run:
        working-directory: intake-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: intake-worker/package-lock.json
      - run: npm ci --no-fund
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm run test:unit
      - name: Closed-site tests (no intake or privacy form on public pages)
        run: npm run test:closed
      - name: End-to-end tests (Worker in local workerd + D1)
        run: npm run test:e2e
      - name: Browser tests (headless Chrome against the closed public site)
        run: npm run test:browser
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intake-worker-test-artifacts
          path: |
            intake-worker/test/artifacts/
          retention-days: 14
