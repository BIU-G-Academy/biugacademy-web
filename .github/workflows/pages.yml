# Public site deployment from an allowlisted artifact (ADR-001).
#
# Only files selected by scripts/site/public-site.json are uploaded. Backend
# code, migrations, Apps Script, internal docs, configuration and tests are
# never part of the artifact.
#
# CUTOVER REQUIRED: this workflow can deploy only after the repository's
# Pages source is switched from "Deploy from a branch" to "GitHub Actions"
# (Settings -> Pages). Until then the deploy job fails and the legacy branch
# deployment keeps serving the whole repository. See
# docs/operations/runbooks/pages-allowlist-cutover.md.

name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site-artifact:
    name: site-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Allowlist tests (positive, negative, guard, deployed-origin simulation)
        run: node --test "scripts/site/test/*.test.mjs"
      - name: Build and verify allowlisted artifact
        run: node scripts/site/build-site.mjs --out _site
      - name: Artifact inventory
        run: |
          echo "### Public artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "$(find _site -type f | wc -l) files" >> "$GITHUB_STEP_SUMMARY"
          find _site -type f | sed 's|^_site/||' | sort
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: site-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-live:
    name: verify-live
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Excluded paths must not be served by the public domain
        run: node scripts/site/verify-deployed.mjs https://biugacademy.org --retries 10 --delay-ms 30000
